name: Revise
# Negative fixture: the resolve job's if: has no author_association check, so any commenter could start a revision.
on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolve:
    if: >-
      vars.AGENTS_PAUSED != 'true' &&
      !contains(github.event.comment.body || '', '<!-- agent:') &&
      (contains(github.event.comment.body || '', '/revise') || github.event.review.state == 'changes_requested')
    runs-on: ubuntu-latest
    steps:
      - run: echo hello
  revise:
    needs: resolve
    concurrency:
      group: revise-${{ needs.resolve.outputs.kind }}-${{ needs.resolve.outputs.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - run: echo hello
