name: Good
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  agent:
    if: >-
      vars.AGENTS_PAUSED != 'true' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/agent-guard.sh preflight
        env:
          AGENT_DAILY_RUNS: ${{ vars.AGENT_DAILY_RUNS }}
      - run: claude -p "hello"
  merge:
    if: vars.AGENTS_PAUSED != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: gh pr merge --auto --squash "$PR"
  safety:
    runs-on: ubuntu-latest
    steps:
      - run: gh pr merge --disable-auto "$PR"
