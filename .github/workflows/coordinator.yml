name: Coordinator

# Picks up approved work (Status = Ready). Project item events do not exist for a user-owned project,
# so the triggers are: the hourly schedule (the fallback that catches anything missed), "Run workflow",
# and events that mean work may have become ready (docs/adr/0014 identities, 0015 this workflow):
#   - the `ready` label is applied to an issue (the doorbell: the owner approves a spec or releases a
#     task, and the architect releases the tasks it plans);
#   - a task or bug issue is closed, or an issue-* PR is merged into main (a `Blocked by:` line may
#     have just cleared).
# The pass never applies `ready` itself, so it cannot start itself.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  issues:
    types: [labeled, closed]
  pull_request:
    types: [closed]
    branches: [main]

# The workflow token only reads. Writes (branches, PRs, comments) use the GitHub App token.
permissions:
  contents: read

jobs:
  coordinate:
    # Kill switch: set the repository variable AGENTS_PAUSED to true to stop all agent runs.
    # Then, per trigger: the schedule and manual runs always; a label event only for `ready`; a closed
    # issue only when it is a task or bug filed by the owner, a member or a collaborator (a stranger can
    # open and close an issue from the template, and every run counts toward the daily cap; tasks the App
    # files are covered by the merged-PR trigger); a PR only when merged, from this repository (no secrets for
    # forks), and from an issue-* branch.
    if: vars.AGENTS_PAUSED != 'true' && (
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.action == 'labeled' &&
        github.event.label.name == 'ready') ||
      (github.event_name == 'issues' && github.event.action == 'closed' &&
        (github.event.issue.author_association == 'OWNER' ||
         github.event.issue.author_association == 'MEMBER' ||
         github.event.issue.author_association == 'COLLABORATOR') &&
        (contains(github.event.issue.labels.*.name, 'type:task') ||
         contains(github.event.issue.labels.*.name, 'type:bug'))) ||
      (github.event_name == 'pull_request' &&
        github.event.pull_request.merged == true &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.event.pull_request.head.ref, 'issue-')))
    # Exactly one coordinator at a time; a run in progress is never cancelled. Set on the job, not the
    # workflow, so a run whose `if:` is false (an unrelated label, a stranger's issue) never enters the
    # group and cannot supersede a pending run. A burst of events queues one pass behind the running one
    # (GitHub cancels the older pending runs, which the daily cap does count: scripts/agent-guard.sh
    # counts cancelled runs, as it cannot tell them from a timed-out one); each pass sweeps every
    # eligible item, so nothing is lost.
    concurrency:
      group: coordinator
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # The App token lives one hour.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # worktrees are created from origin/main
          # Do not keep the read-only workflow token in git's config: git would push with it (403).
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}   # a merged PR's merge ref may be gone

      - name: Mint the GitHub App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      - name: Let git act as the GitHub App
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh auth setup-git

      - name: Install uv and Python (so the developer can run make check)
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"

      - name: Install the claude CLI
        run: npm install -g "@anthropic-ai/claude-code@2.1.308"

      - name: Resolve the App bot identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          set -euo pipefail
          id=$(gh api "users/${APP_SLUG}%5Bbot%5D" --jq .id)
          echo "name=${APP_SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${id}+${APP_SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Preflight
        id: preflight
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          AGENT_DAILY_RUNS: ${{ vars.AGENT_DAILY_RUNS }}   # unset means the guard's default (12)
        run: |
          rc=0
          scripts/agent-guard.sh preflight || rc=$?
          if [ "$rc" -eq 78 ]; then
            echo "::notice::Daily agent cap reached; the coordinator is skipping this run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi

      # Runs only on the cap-skip path. The guard reads it to leave this run out of the daily count.
      - name: Daily cap skip
        if: steps.preflight.outputs.skip == 'true'
        run: echo "The daily cap skipped this run; it is not counted."

      # A `ready` label event: set the card to Ready if needed, remove the label, then one pass.
      - name: Run the coordinator (ready label)
        if: steps.preflight.outputs.skip != 'true' && github.event_name == 'issues' && github.event.action == 'labeled'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          AGENT_GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER || '1' }}
          MAX_PARALLEL: ${{ vars.MAX_PARALLEL || '1' }}
          ARCHITECT_MAX_TURNS: ${{ vars.ARCHITECT_MAX_TURNS || '60' }}
          DEVELOPER_MAX_TURNS: ${{ vars.DEVELOPER_MAX_TURNS || '80' }}
          AGENT_GIT_NAME: ${{ steps.bot.outputs.name }}
          AGENT_GIT_EMAIL: ${{ steps.bot.outputs.email }}
        run: scripts/coordinator.sh --ready-label ${{ github.event.issue.number }}

      # Every other trigger: one normal pass.
      - name: Run the coordinator
        if: steps.preflight.outputs.skip != 'true' && !(github.event_name == 'issues' && github.event.action == 'labeled')
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          AGENT_GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER || '1' }}
          MAX_PARALLEL: ${{ vars.MAX_PARALLEL || '1' }}
          ARCHITECT_MAX_TURNS: ${{ vars.ARCHITECT_MAX_TURNS || '60' }}
          DEVELOPER_MAX_TURNS: ${{ vars.DEVELOPER_MAX_TURNS || '80' }}
          AGENT_GIT_NAME: ${{ steps.bot.outputs.name }}
          AGENT_GIT_EMAIL: ${{ steps.bot.outputs.email }}
        run: scripts/coordinator.sh --once
