name: Review

# The reviewer agent reviews every agent PR into main (docs/adr/0013, 0014, 0015). It runs with the
# workflow token, so its review comes from github-actions[bot] and never from the PR's author.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review, reopened]

# A newer push supersedes the review in progress.
concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: read
  checks: read

jobs:
  review:
    needs: ci-output
    # Same-repository PRs only (a fork gets no secrets), no drafts, agent branches only, and the
    # kill switch: set the repository variable AGENTS_PAUSED to true to stop all agent runs.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !cancelled() &&
      github.event.pull_request.draft == false &&
      (startsWith(github.event.pull_request.head.ref, 'issue-') ||
       startsWith(github.event.pull_request.head.ref, 'arch-')) &&
      vars.AGENTS_PAUSED != 'true'
    runs-on: ubuntu-latest
    # 30 = the 12-minute wait step + the 18-minute review step (ADR 0015). The loop is bounded by
    # wall-clock time, and the wait step is continue-on-error, so the reviewer runs either way.
    timeout-minutes: 30
    outputs:
      skip: ${{ steps.preflight.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the claude CLI
        run: npm install -g "@anthropic-ai/claude-code@2.1.308"

      - name: Wait for the check job on the head SHA
        timeout-minutes: 12
        # If the backstop ever fires, preflight and the reviewer must still run (they see the check
        # as pending), so a timed-out wait never means "no review".
        continue-on-error: true
        if: hashFiles('scripts/wait-for-check.sh') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WAIT_SECONDS: "720"   # at most 12 minutes, by wall-clock time (scripts/wait-for-check.sh)
        run: bash scripts/wait-for-check.sh "$HEAD_SHA"

      - name: Preflight
        id: preflight
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          AGENT_DAILY_RUNS: ${{ vars.AGENT_DAILY_RUNS }}   # unset means the guard's default (12)
        run: |
          rc=0
          scripts/agent-guard.sh preflight || rc=$?
          if [ "$rc" -eq 78 ]; then
            echo "::notice::Daily agent cap reached; skipping this review."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi

      # A skipped review must not look like a pass. This is the only skip reason that reaches a step
      # (the job's own `if:` skips the whole job). The run concludes success with the "Run the
      # reviewer" step skipped, which scripts/agent-guard.sh uses to leave it out of the daily count.
      - name: Comment that the daily cap skipped the review
        if: steps.preflight.outputs.skip == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          AGENT_DAILY_RUNS: ${{ vars.AGENT_DAILY_RUNS }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/agent-guard.sh skip-comment --number "$PR_NUMBER" --sha "$HEAD_SHA"

      # The trusted ci-output job's text, written as data; review.sh gives the reviewer the file.
      # It goes through the environment, never a command line, and is empty if that job found nothing.
      - name: Write the CI output for the reviewer
        if: steps.preflight.outputs.skip != 'true'
        env:
          CI_OUTPUT: ${{ needs.ci-output.outputs.text }}
        run: |
          mkdir -p .agent-tmp
          if [ -n "$CI_OUTPUT" ]; then printf '%s\n' "$CI_OUTPUT" > .agent-tmp/ci-failure.md; fi

      - name: Run the reviewer
        if: steps.preflight.outputs.skip != 'true'
        timeout-minutes: 18
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REVIEWER_MODEL: ${{ vars.REVIEWER_MODEL }}
          REVIEWER_MAX_TURNS: ${{ vars.REVIEWER_MAX_TURNS }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p .agent-tmp
          scripts/review.sh "$PR_NUMBER"

  # The merge gate is a script, not the model. It is a separate job on a fresh runner, so no step of
  # the review job (which runs the PR's own scripts) can alter its environment or PATH. It checks
  # out only the base branch: the PR's code never runs with the App token. The App token (not
  # github.token) is used so the merge's push to main triggers CI on main (ADR 0014). The same
  # script dispatches revise.yml when the reviewer requests changes (within REVISION_BUDGET rounds).
  # Until after-review.sh exists on main, the last step is skipped.
  merge-gate:
    needs: review
    if: >-
      needs.review.outputs.skip != 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.AGENTS_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # actions: write lets this job dispatch revise.yml (gh workflow run) when the reviewer requests
    # changes. It is on this job only: the review job above runs the PR's own scripts and must not have it.
    permissions:
      contents: read
      actions: write
    steps:
      - name: Check out the base branch for the merge gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: trusted
          persist-credentials: false

      - name: Mint the GitHub App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      - name: Enable auto-merge for low-risk approved PRs
        if: hashFiles('trusted/scripts/after-review.sh') != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          AGENTS_PAUSED: ${{ vars.AGENTS_PAUSED }}
          REVISION_BUDGET: ${{ vars.REVISION_BUDGET }}   # unset means the script's default (3)
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash trusted/scripts/after-review.sh "$PR_NUMBER"

  # The failing CI output for the reviewer (#192). The reviewer never runs the tests itself, so it
  # needs what CI printed. This job runs on base-branch code only (no PR code runs here) and is the
  # only job with `actions: read`, which the review job (it runs the PR's own scripts, #166) must not
  # have. It waits for the `check` job, then scripts/ci-failure.sh quotes the end of the failed log.
  # The text goes to the review job as a job output and is only ever written to a file there, never
  # run or interpolated into a shell command. Every step is continue-on-error, so this job never
  # blocks a review: the review job says the output was unavailable. Until scripts/ci-failure.sh is on
  # the base branch the fetch step is skipped.
  ci-output:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      (startsWith(github.event.pull_request.head.ref, 'issue-') ||
       startsWith(github.event.pull_request.head.ref, 'arch-')) &&
      vars.AGENTS_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
      actions: read
    outputs:
      text: ${{ steps.fetch.outputs.text }}
    steps:
      - name: Check out the base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      - name: Wait for the check job on the head SHA
        timeout-minutes: 12
        continue-on-error: true
        if: hashFiles('scripts/wait-for-check.sh') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WAIT_SECONDS: "720"
        run: bash scripts/wait-for-check.sh "$HEAD_SHA"

      - name: Quote the failing CI output
        id: fetch
        if: hashFiles('scripts/ci-failure.sh') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          text=$(bash scripts/ci-failure.sh "$HEAD_SHA")
          delim="ci_output_$(openssl rand -hex 8)"
          {
            echo "text<<$delim"
            printf '%s\n' "$text"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"
