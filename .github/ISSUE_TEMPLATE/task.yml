name: Task
description: One implementable unit from an approved plan (normally created by the architect as a sub-issue of a feature)
labels: ["type:task"]
body:
  - type: input
    id: parent
    attributes: { label: Parent feature issue, placeholder: "#12" }
    validations: { required: true }
  - type: textarea
    id: goal
    attributes: { label: Goal }
    validations: { required: true }
  - type: textarea
    id: ac
    attributes: { label: Acceptance criteria, description: Which parent AC numbers this covers, plus any task-specific checks }
    validations: { required: true }
  - type: textarea
    id: tests
    attributes: { label: Tests to write first, description: "Specific tests, including edge cases, to write and see fail before implementing" }
    validations: { required: true }
  - type: textarea
    id: deps
    attributes: { label: Dependencies / blocked by, description: "One line the coordinator can read: 'Blocked by: #12, #15' (issues that must be closed, PRs that must be merged) or 'Blocked by: none'" }
